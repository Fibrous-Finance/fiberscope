name: Deploy

# Production on every push to main; a preview version (own URL, production untouched) for every
# pull request from this repository. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets and the CLOUDFLARE_WORKERS_SUBDOMAIN variable; without the token it skips itself.

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    credentials:
        runs-on: ubuntu-latest
        outputs:
            ready: ${{ steps.check.outputs.ready }}
        steps:
            - id: check
              env:
                  TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  if [ -n "$TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
                  else echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the deploy."; fi

    deploy:
        needs: credentials
        if: needs.credentials.outputs.ready == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Deploy production
              if: github.event_name == 'push'
              run: pnpm --filter @fiberscope/web run deploy

            - name: Upload the preview version
              if: github.event_name == 'pull_request'
              working-directory: apps/web
              run: |
                  pnpm exec opennextjs-cloudflare build
                  pnpm exec opennextjs-cloudflare upload --preview-alias "pr-${{ github.event.number }}"

            - name: Link the preview in the pull request
              if: github.event_name == 'pull_request' && vars.CLOUDFLARE_WORKERS_SUBDOMAIN != ''
              uses: actions/github-script@v9
              env:
                  PREVIEW_URL: https://pr-${{ github.event.number }}-fiberscope.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
              with:
                  script: |
                      const marker = "<!-- fiberscope-preview -->";
                      const head = context.payload.pull_request.head.sha.slice(0, 7);
                      const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}\n\nCommit ${head}.`;
                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
                      const previous = comments.find((c) => c.body?.startsWith(marker));
                      if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
                      else await github.rest.issues.createComment({ owner, repo, issue_number, body });
